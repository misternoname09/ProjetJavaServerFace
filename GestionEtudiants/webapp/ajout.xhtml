<!DOCTYPE html >
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui">

<h:head>
	<title> Formulaire d'ajout etudiant</title>
</h:head>
<h:body>
<p:accordionPanel>
       <p:tab title="Formulaire d'ajout étudiant">
           <f:view>
              <h:form id="formAjout">
                 <p:panelGrid columns="3">
                     <p:outputLabel for="nom" value="Nom: "/>
                     <p:inputText id="nom" value="#{etudiantBean.etudiant.nom}" required="true" requiredMessage="Le nom est obligatoire"/>
                     <p:message for="nom" />

                     <p:outputLabel for="prenom" value="Prénom: "/>
                     <p:inputText id="prenom" value="#{etudiantBean.etudiant.prenom}" required="true" requiredMessage="Le prénom est obligatoire"/>
                     <p:message for="prenom" />

                     <p:outputLabel for="datenaiss" value="Date de Naissance: "/>
                     <p:calendar id="datenaiss" value="#{etudiantBean.etudiant.datenaiss}" required="true" requiredMessage="La date de naissance est obligatoire"/>
                     <p:message for="datenaiss" />
                 </p:panelGrid>
                 <br></br>
                 <h:commandButton action="#{etudiantBean.AddEtudiant(etudiantBean.etudiant)}" value="Enregistrer"></h:commandButton>
				</h:form>
           </f:view>
       </p:tab>
</p:accordionPanel>
</h:body>





</html>
