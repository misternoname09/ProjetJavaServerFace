<!DOCTYPE html >
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui">

<h:head>
	<title> Formulaire d'ajout etudiant</title>
</h:head>
<h:body>
<p:accordionPanel>
       <p:tab title="Formulaire d'ajout étudiant">
           <f:view>
              <h:form id="addForm">
                 <p:panelGrid columns="3">
                     <p:outputLabel for="nom" value="Nom: "/>
                     <p:inputText id="nom" value="#{etudiantBean.etudiant.nom}" required="true"/>
                     <p:message for="nom" />

                     <p:outputLabel for="prenom" value="Prénom: "/>
                     <p:inputText id="prenom" value="#{etudiantBean.etudiant.prenom}" required="true"/>
                     <p:message for="prenom" />

                     <p:outputLabel for="dateNais" value="Date de Naissance: "/>
                     <p:calendar id="dateNais" value="#{etudiantBean.etudiant.datenaiss}" showOn="button"/>
                     <p:message for="dateNais" />

                     <f:facet name="footer">
                        <h:commandButton action="#{etudiantBean.AddEtudiant(etudiantBean.etudiant)}" value="Enregistrer" />
                     </f:facet>
                 </p:panelGrid>
				</h:form>
           </f:view>
       </p:tab>
</p:accordionPanel>
</h:body>





</html>
