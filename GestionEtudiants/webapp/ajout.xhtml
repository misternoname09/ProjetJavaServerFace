<!DOCTYPE html >
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:a="http://xmlns.jcp.org/jsf/passthrough">
	
<h:head>	
	<title> Formulaire d'ajout etudiant</title>
</h:head>
<h:body>
<p:accordionPanel>
       <p:tab title="Formulaire d'ajout étudiant">
           <f:view>
              <h:form id="formAjout">
                 <p:panelGrid columns="2" styleClass="ui-panelgrid-blank">
                     <p:outputLabel for="nom" value="Nom: "/>
                     <p:inputText id="nom" value="#{etudiantBean.etudiant.nom}" a:placeholder="Votre nom" required="true"/>
                     <p:outputLabel for="prenom" value="Prénom: "/>
                     <p:inputText id="prenom" value="#{etudiantBean.etudiant.prenom}" a:placeholder="Votre prénom" required="true"/>
                     <p:outputLabel for="datenaiss" value="Date de Naissance: "/>
                     <p:calendar id="datenaiss" value="#{etudiantBean.etudiant.datenaiss}" pattern="dd/MM/yyyy" a:placeholder="jj/mm/aaaa"/>
                 </p:panelGrid>
                 <br/>
                 <h:commandButton action="liste" value="Enregistrer"/>
                 &#160;
                 <h:commandButton action="liste" value="Annuler" immediate="true"/>
              </h:form>
           </f:view>
       </p:tab>
</p:accordionPanel>
</h:body>
	




</html>
