<!DOCTYPE html >
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:a="http://xmlns.jcp.org/jsf/passthrough">

<h:head>
	<title> Formulaire d'ajout etudiant</title>
</h:head>
<h:body>
<p:accordionPanel>
       <p:tab title="Formulaire d'ajout étudiant">
           <f:view>
              <h:form id="addForm">
                 <p:panelGrid columns="3">
                     <p:outputLabel for="nom" value="Nom: "/>
                     <p:inputText id="nom" value="#{etudiantBean.etudiant.nom}" a:placeholder="votre nom" required="true" />
                     <p:message for="nom" />

                     <p:outputLabel for="prenom" value="Prénom: "/>
                     <p:inputText id="prenom" value="#{etudiantBean.etudiant.prenom}" a:placeholder="votre prénom" required="true" />
                     <p:message for="prenom" />

                     <p:outputLabel for="datenaiss" value="Date de Naissance: "/>
                     <p:calendar id="datenaiss" value="#{etudiantBean.etudiant.datenaiss}" a:placeholder="votre date de naissance" required="true" pattern="dd/MM/yyyy" />
                     <p:message for="datenaiss" />

                     <f:facet name="footer">
                         <h:commandButton action="#{etudiantBean.AddEtudiant(etudiantBean.etudiant)}" value="Enregistrer" style="margin-right:10px;"/>
                         <h:commandButton value="Annuler" action="liste" immediate="true" />
                     </f:facet>
                 </p:panelGrid>
              </h:form>
           </f:view>
       </p:tab>
</p:accordionPanel>
</h:body>





</html>
