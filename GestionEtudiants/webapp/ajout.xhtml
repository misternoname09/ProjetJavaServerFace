<!DOCTYPE html >
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:a="http://xmlns.jcp.org/jsf/passthrough">

<h:head>
	<title> Formulaire d'ajout etudiant</title>
</h:head>
<h:body>
<p:accordionPanel>
       <p:tab title="Formulaire d'ajout étudiant">
           <f:view>
              <h:form id="ajoutForm">
                 <h:panelGrid columns="3">
                     <p:outputLabel for="nom" value="Nom: "/>
                     <p:inputText id="nom" value="#{etudiantBean.etudiant.nom}" a:placeholder="Entrez le nom"/>
                     <p:message for="nom" />

                     <p:outputLabel for="prenom" value="Prénom: "/>
                     <p:inputText id="prenom" value="#{etudiantBean.etudiant.prenom}" a:placeholder="Entrez le prénom"/>
                     <p:message for="prenom" />

                     <p:outputLabel for="datenaiss" value="Date de Naissance: "/>
                     <p:calendar id="datenaiss" value="#{etudiantBean.etudiant.datenaiss}" a:placeholder="dd/MM/yyyy"/>
                     <p:message for="datenaiss" />

                     <f:facet name="footer">
                        <h:commandButton action="#{etudiantBean.AddEtudiant(etudiantBean.etudiant)}" value="Enregistrer"></h:commandButton>
                     </f:facet>
                 </h:panelGrid>
				</h:form>
           </f:view>
       </p:tab>
</p:accordionPanel>
</h:body>





</html>
