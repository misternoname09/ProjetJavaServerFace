<!DOCTYPE html >
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:a="http://xmlns.jcp.org/jsf/passthrough">

<h:head>
	<title> Formulaire d'ajout etudiant</title>
</h:head>
<h:body>
<p:accordionPanel>
       <p:tab title="Formulaire d'ajout étudiant">
           <f:view>
              <h:form>
                 <p:outputLabel for="nom" value="Nom: "/>
                 <p:inputText id="nom" value="#{etudiantBean.etudiant.nom}" a:placeholder="Votre nom" required="true"/>
                 <p:message for="nom" />
                 <br></br>
                 <p:outputLabel for="prenom" value="Prénom: "/>
                 <p:inputText id="prenom" value="#{etudiantBean.etudiant.prenom}" a:placeholder="Votre prénom" required="true"/>
                 <p:message for="prenom" />
                 <br></br>
                 <p:outputLabel for="datenaiss" value="Date de Naissance: "/>
                 <p:calendar id="datenaiss" value="#{etudiantBean.etudiant.datenaiss}" a:placeholder="dd/mm/yyyy" required="true"/>
                 <p:message for="datenaiss" />
                 <br></br>
                 <h:commandButton action="#{etudiantBean.AddEtudiant(etudiantBean.etudiant)}" value="Enregistrer"></h:commandButton>
				</h:form>
           </f:view>
       </p:tab>
</p:accordionPanel>
</h:body>





</html>
