<!DOCTYPE html >
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui">
	
<h:head>	
	<title> Formulaire d'ajout etudiant</title>
</h:head>
<h:body>
<p:accordionPanel>
       <p:tab title="Formulaire d'ajout étudiant">
              <h:form>
                 <p:outputLabel for="nom" value="Nom: "/>
                 <p:inputText id="nom" value="#{etudiantBean.etudiant.nom}"/> <br></br>
                 <br></br>
                 <p:outputLabel for="prenom" value="Prénom: "/>
                 <p:inputText id="prenom" value="#{etudiantBean.etudiant.prenom}"/> <br></br>
                 <br></br>
                 <p:outputLabel for="datenaiss" value="Date de Naissance: "/>
                 <p:calendar id="datenaiss" value="#{etudiantBean.etudiant.datenaiss}" pattern="dd/MM/yyyy"/><br></br>
                 <br></br>
                 <h:commandButton action="liste" value="Enregistrer" title="Enregistrer l'étudiant"></h:commandButton>
                 <h:commandButton action="liste" value="Annuler" immediate="true" title="Annuler et retourner à la liste"></h:commandButton>
				</h:form>
       </p:tab>
</p:accordionPanel>
</h:body>
</html>
