<!DOCTYPE html >
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui">
	
<h:head>	
	<title> Formulaire d'ajout etudiant</title>
</h:head>
<h:body>
<p:accordionPanel>
       <p:tab title="Formulaire d'ajout étudiant">
           <f:view>
              <h:form>
                 <p:outputLabel for="nomInput" value="Nom: "/>
                 <p:inputText id="nomInput" value="#{etudiantBean.etudiant.nom}" title="Nom de l'étudiant"/> <br></br>
                 <br></br>
                 <p:outputLabel for="prenomInput" value="Prénom: "/>
                 <p:inputText id="prenomInput" value="#{etudiantBean.etudiant.prenom}" title="Prénom de l'étudiant"/> <br></br>
                 <br></br>
                 <p:outputLabel for="dateNaisInput" value="Date de Naissance: "/>
                 <p:calendar id="dateNaisInput" value="#{etudiantBean.etudiant.datenaiss}" pattern="dd/MM/yyyy" title="Date de naissance de l'étudiant"/><br></br>
                 <br></br>
                 <h:commandButton action="liste" value="Enregistrer" title="Enregistrer l'étudiant"></h:commandButton>
				</h:form>
           </f:view>
       </p:tab>
</p:accordionPanel>
</h:body>
	




</html>
