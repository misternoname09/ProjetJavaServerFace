<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:a="http://xmlns.jcp.org/jsf/passthrough">
	 
	
	<f:metadata>
	    <f:event listener="#{etudiantBean.chargerListeEtudiant}" type="preRenderView"></f:event>
	</f:metadata>
		
<h:head>
   <title>Liste des Etudiants</title>
</h:head>
<h:body>
   <p:accordionPanel>
       <p:tab title="Liste étudiants">
           <f:view>
              <h:form id="formListe">
                <h:outputText value="Liste étudiants"></h:outputText>
                  <p:dataTable value="#{etudiantBean.listeEtudiant}" var="et"
                   style="margin:auto; text-align:left">
                     <p:column>
                       <f:facet name="header">ID</f:facet>
                       #{et.id}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Nom</f:facet>
                       #{et.nom}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Prénom</f:facet>
                       #{et.prenom}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Date de Naissance</f:facet>
                       #{et.datenaiss}
                     </p:column>
                      <p:column>
                      <f:facet name="header">Modifier</f:facet>
                       <h:commandLink value="modifier" action="#{etudiantBean.updateEtudiant(et.id)}"
                                      a:aria-label="Modifier l'etudiant #{et.nom} #{et.prenom}"/>
                     </p:column>
                     
                       <p:column>
                       <f:facet name="header">Supprimer</f:facet>
                       <h:commandButton value="Supprimer" 
                                      onclick="if (!confirm('Voulez-vous supprimer l\'etudiant ?')) return false;"
                                      action="#{etudiantBean.deleteEtudiant(et.id)}"
                                      a:aria-label="Supprimer l'etudiant #{et.nom} #{et.prenom}"/>
                     </p:column>
                  </p:dataTable>
              </h:form>
           </f:view>
       </p:tab>
</p:accordionPanel>
   
    <h1>Créer/Editer un Etudiant</h1>
    <h:form id="formAjout">
     <h:panelGrid columns="3">
                 <p:outputLabel value="Nom: " for="nomInput"/>
                 <p:inputText id="nomInput" value="#{etudiantBean.etudiant.nom}" required="true" a:placeholder="votre nom" />
                 <p:message for="nomInput" />
                 <p:outputLabel value="Prénom: " for="prenomInput"/>
                 <p:inputText id="prenomInput" value="#{etudiantBean.etudiant.prenom}" required="true" a:placeholder="votre prénom" />
                 <p:message for="prenomInput" />
                 <p:outputLabel value="Date de Naissance: " for="datenaissInput"/>
                 <p:calendar id="datenaissInput" value="#{etudiantBean.etudiant.datenaiss}" required="true" pattern="dd/MM/yyyy" a:placeholder="votre date de naissance"/>
                 <p:message for="datenaissInput" />
                 <h:commandButton value="Enregistrer" action="#{etudiantBean.AddEtudiant(etudiantBean.etudiant)}" />
     </h:panelGrid>
    </h:form>
    </h:body>

</html>
