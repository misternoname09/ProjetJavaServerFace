<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:a="http://xmlns.jcp.org/jsf/passthrough">
	 
	
	<f:metadata>
	    <f:event listener="#{etudiantBean.chargerListeEtudiant}" type="preRenderView"></f:event>
	</f:metadata>
		
<h:head>
   <title>Liste des Etudiants</title>
</h:head>
<h:body>
   <p:accordionPanel>
       <p:tab title="Liste étudiants">
           <f:view>
              <h:form>
                <h:outputText value="Liste étudiants"></h:outputText>

                  <p:dataTable value="#{etudiantBean.listeEtudiant}" var="e"
                   style="margin:auto; text-align:left">
                     <p:column>
                       <f:facet name="header">ID</f:facet>
                       #{e.id}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Nom</f:facet>
                       #{e.nom}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Prénom</f:facet>
                       #{e.prenom}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Date de Naissance</f:facet>
                       #{e.datenaiss}
                     </p:column>
                      <p:column>
                      <f:facet name="header">Modifier</f:facet>
                       <h:commandLink a:aria-label="Modifier l'etudiant #{e.nom}" value="modifier" action="#{etudiantBean.updateEtudiant(e.id)}"/>
                     </p:column>
                     
                       <p:column>
                       <f:facet name="header">Supprimer</f:facet>
                       <h:commandButton a:aria-label="Supprimer l'etudiant #{e.nom}" value="Supprimer"
                                      onclick=" if(! confirm('voulez-vous supprimer l\'etudiant')) return false;"
                                      action="#{etudiantBean.deleteEtudiant(e.id)}"/>
                     </p:column>
                  </p:dataTable>

              </h:form>
           </f:view>
       </p:tab>
</p:accordionPanel>
   
    <h1>Créer/Editer un Etudiant</h1>
<h:form id="formAjout">
     <p:panelGrid columns="3">
                 <p:outputLabel for="nom" value="Nom: "/>
                 <p:inputText id="nom" required="true" value="#{etudiantBean.etudiant.nom}" a:placeholder="votre nom" />
                 <p:message for="nom"/>
                 <p:outputLabel for="prenom" value="Prénom: "/>
                 <p:inputText id="prenom" required="true" value="#{etudiantBean.etudiant.prenom}" a:placeholder="votre prénom" />
                 <p:message for="prenom"/>
                 <p:outputLabel for="datenaiss" value="Date de Naissance: "/>
                 <p:calendar id="datenaiss" required="true" pattern="dd/MM/yyyy" value="#{etudiantBean.etudiant.datenaiss}" a:placeholder="votre date de naissance"/>
                 <p:message for="datenaiss"/>
<h:outputText value="" />
<h:outputText value="" />
                 <h:commandButton value="Enregistrer" action="#{etudiantBean.AddEtudiant(etudiantBean.etudiant)}" />

     </p:panelGrid>
</h:form>
    </h:body>

</html>
