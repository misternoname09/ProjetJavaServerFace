<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:a="http://xmlns.jcp.org/jsf/passthrough">


	<f:metadata>
	    <f:event listener="#{etudiantBean.chargerListeEtudiant}" type="preRenderView"></f:event>
	</f:metadata>

<h:head>
   <title>Liste des Etudiants</title>
</h:head>
<h:body>
   <p:accordionPanel>
       <p:tab title="Liste étudiants">
           <f:view>
              <h:form>
                <h:outputText value="Liste étudiants" style="font-weight:bold; font-size: 1.2em;"/>
                  <p:dataTable value="#{etudiantBean.listeEtudiant}" var="e"
                   style="margin:auto; text-align:left">
                     <p:column>
                       <f:facet name="header">ID</f:facet>
                       #{e.id}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Nom</f:facet>
                       #{e.nom}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Prénom</f:facet>
                       #{e.prenom}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Date de Naissance</f:facet>
                       <h:outputText value="#{e.datenaiss}">
                           <f:convertDateTime pattern="dd/MM/yyyy" />
                       </h:outputText>
                     </p:column>
                      <p:column>
                      <f:facet name="header">Modifier</f:facet>
                       <h:commandLink value="modifier" action="#{etudiantBean.updateEtudiant(e.id)}"
                                      a:aria-label="Modifier l'étudiant #{e.nom} #{e.prenom}"/>
                     </p:column>

                       <p:column>
                       <f:facet name="header">Supprimer</f:facet>
                       <h:commandButton value="Supprimer"
                                      onclick="if(! confirm('Voulez-vous vraiment supprimer l\'étudiant #{e.nom}?')) return false;"
                                      action="#{etudiantBean.deleteEtudiant(e.id)}"
                                      a:aria-label="Supprimer l'étudiant #{e.nom} #{e.prenom}"/>
                     </p:column>
                  </p:dataTable>
              </h:form>
           </f:view>
       </p:tab>
</p:accordionPanel>

    <h:form>
        <h1>Créer/Editer un Etudiant</h1>
        <p:panelGrid columns="3">
            <p:outputLabel for="nom" value="Nom: "/>
            <p:inputText id="nom" value="#{etudiantBean.etudiant.nom}" a:placeholder="Votre nom" required="true"/>
            <p:message for="nom" />

            <p:outputLabel for="prenom" value="Prénom: "/>
            <p:inputText id="prenom" value="#{etudiantBean.etudiant.prenom}" a:placeholder="Votre prénom" required="true"/>
            <p:message for="prenom" />

            <p:outputLabel for="datenaiss" value="Date de Naissance: "/>
            <p:calendar id="datenaiss" value="#{etudiantBean.etudiant.datenaiss}" a:placeholder="dd/mm/yyyy" required="true"/>
            <p:message for="datenaiss" />

            <h:commandButton value="Enregistrer" action="#{etudiantBean.AddEtudiant(etudiantBean.etudiant)}" />
            <h:outputText value="" />
            <h:outputText value="" />
        </p:panelGrid>
    </h:form>
    </h:body>

</html>
