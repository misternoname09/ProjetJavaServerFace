<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:a="http://xmlns.jcp.org/jsf/passthrough">
	 
	
	<f:metadata>
	    <f:event listener="#{etudiantBean.chargerListeEtudiant}" type="preRenderView"></f:event>
	</f:metadata>
		
<h:head>
   <title>Liste des Etudiants</title>
</h:head>
<h:body>
   <p:accordionPanel>
       <p:tab title="Liste étudiants">
           <f:view>
              <h:form id="formListe">
                <h:outputText value="Liste étudiants" style="font-weight: bold; margin-bottom: 10px; display: block;"/>
                  <p:dataTable value="#{etudiantBean.listeEtudiant}" var="et"
                   style="margin:auto; text-align:left">
                     <p:column>
                       <f:facet name="header">ID</f:facet>
                       #{et.id}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Nom</f:facet>
                       #{et.nom}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Prénom</f:facet>
                       #{et.prenom}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Date de Naissance</f:facet>
                       <h:outputText value="#{et.datenaiss}"><f:convertDateTime pattern="dd/MM/yyyy" /></h:outputText>
                     </p:column>
                      <p:column>
                      <f:facet name="header">Modifier</f:facet>
                       <h:commandLink value="modifier" action="#{etudiantBean.updateEtudiant(et.id)}" a:aria-label="Modifier l'étudiant #{et.nom}"/>
                     </p:column>
                     
                       <p:column>
                       <f:facet name="header">Supprimer</f:facet>
                       <h:commandButton value="Supprimer" 
                                      onclick="return confirm('Voulez-vous vraiment supprimer cet étudiant ?');"
                                      action="#{etudiantBean.deleteEtudiant(et.id)}"
                                      a:aria-label="Supprimer l'étudiant #{et.nom}"/>
                     </p:column>
                  </p:dataTable>
              </h:form>
           </f:view>
       </p:tab>
</p:accordionPanel>
   
    <h1>Créer/Editer un Etudiant</h1>
    <h:form id="formAjout">
     <p:panelGrid columns="3">
                 <p:outputLabel for="nom" value="Nom: "/>
                 <p:inputText id="nom" value="#{etudiantBean.etudiant.nom}" a:placeholder="votre nom" required="true" requiredMessage="Le nom est requis." />
                 <p:message for="nom" />

                 <p:outputLabel for="prenom" value="Prénom: "/>
                 <p:inputText id="prenom" value="#{etudiantBean.etudiant.prenom}" a:placeholder="votre prénom" required="true" requiredMessage="Le prénom est requis." />
                 <p:message for="prenom" />

                 <p:outputLabel for="dateNais" value="Date de Naissance: "/>
                 <p:calendar id="dateNais" value="#{etudiantBean.etudiant.datenaiss}" a:placeholder="votre date de naissance" pattern="dd/MM/yyyy" required="true" requiredMessage="La date de naissance est requise." />
                 <p:message for="dateNais" />

                 <h:commandButton value="Enregistrer" action="#{etudiantBean.AddEtudiant(etudiantBean.etudiant)}" />
                 <h:commandButton value="Annuler" action="liste" immediate="true" style="margin-left: 10px;" />
                 <br/>
     </p:panelGrid>
    </h:form>
    </h:body>

</html>
