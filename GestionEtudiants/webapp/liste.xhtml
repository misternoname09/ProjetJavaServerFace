<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:a="http://xmlns.jcp.org/jsf/passthrough">
	 
	
	<f:metadata>
	    <f:event listener="#{etudiantBean.chargerListeEtudiant}" type="preRenderView"></f:event>
	</f:metadata>
		
<h:head>
   <title>Liste des Etudiants</title>
</h:head>
<h:body>
   <p:accordionPanel>
       <p:tab title="Liste étudiants">
           <f:view>
              <h:form>
                <h:outputText value="Liste étudiants"></h:outputText>
                  <h.form> 
                  <p:dataTable value="#{etudiantBean.listeEtudiant}" var="e"
                   style="margin:auto; text-align:left">
                     <p:column>
                       <f:facet name="header">ID</f:facet>
                       #{et.id}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Nom</f:facet>
                       #{et.nom}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Prénom</f:facet>
                       #{et.prenom}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Date de Naissance</f:facet>
                       #{et.dateNais}
                     </p:column>
                      <p:column>
                      <f:facet name="header">Modifier</f:facet>
                       <h:commandLink value="modifier" action="#{etudiantBean.updateEtudiant(e.id)}"/>
                     </p:column>
                     
                       <p:column>
                       <f:facet name="header">Supprimer</f:facet>
                       <h:commandButton value="Supprimer" a:aria-label="Supprimer cet etudiant"
                                      onclick=" if(! confirm('Voulez-vous supprimer cet etudiant ?')) return false;"
                                      action="#{etudiantBean.deleteEtudiant(e.id)}"/>
                     </p:column>
                  </p:dataTable>
                  </h.form>
              </h:form>
           </f:view>
       </p:tab>
</p:accordionPanel>
   
    <h1>Créer/Editer un Etudiant</h1>
     <p:panelGrid columns="3">
                 <p:outputLabel for="nomInput" value="Nom: "/>
                 <p:inputText id="nomInput" value="#{etudiantBean.etudiant.nom}" a:placeholder="votre nom" a:aria-label="Nom" />
                 <br/>
                 <p:outputLabel for="prenomInput" value="Prénom: "/>
                 <p:inputText id="prenomInput" value="#{etudiantBean.etudiant.prenom}" a:placeholder="votre prénom" a:aria-label="Prénom" />
                 <br/>
                 <p:outputLabel for="dateNaissInput" value="Date de Naissance: "/>
                 <p:calendar id="dateNaissInput" value="#{etudiantBean.etudiant.datenaiss}" a:placeholder="votre date de naissance" a:aria-label="Date de Naissance"/>
                 <br/>
                 <h:commandButton value="Enregistrer" action="#{etudiantBean.addEtudiant(etudiantBean.etudiant)}" a:aria-label="Enregistrer l'etudiant" />
                 <br/>
     </p:panelGrid>
    </h:body>

</html>
