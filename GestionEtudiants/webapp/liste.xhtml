<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:a="http://xmlns.jcp.org/jsf/passthrough">
	 
	
	<f:metadata>
	    <f:event listener="#{etudiantBean.chargerListeEtudiant}" type="preRenderView"></f:event>
	</f:metadata>
		
<h:head>
   <title>Liste des Etudiants</title>
</h:head>
<h:body>
   <p:accordionPanel>
       <p:tab title="Liste étudiants">
           <f:view>
              <h:form id="formListe">
                <h:outputText value="Liste étudiants" style="font-weight:bold; font-size:1.2em; display:block; margin-bottom:10px;" />
                  <p:dataTable value="#{etudiantBean.listeEtudiant}" var="et"
                   style="margin:auto; text-align:left">
                     <p:column headerText="ID">
                       #{et.id}
                     </p:column>
                     <p:column headerText="Nom">
                       #{et.nom}
                     </p:column>
                     <p:column headerText="Prénom">
                       #{et.prenom}
                     </p:column>
                     <p:column headerText="Date de Naissance">
                       #{et.datenaiss}
                     </p:column>
                     <p:column headerText="Modifier">
                       <h:commandLink value="modifier" action="#{etudiantBean.updateEtudiant(et.id)}" a:aria-label="Modifier l'etudiant #{et.nom}"/>
                     </p:column>
                     
                     <p:column headerText="Supprimer">
                       <h:commandButton value="Supprimer" 
                                      onclick="if(! confirm('Voulez-vous supprimer cet etudiant ?')) return false;"
                                      action="#{etudiantBean.deleteEtudiant(et.id)}"
                                      a:aria-label="Supprimer l'etudiant #{et.nom}"/>
                     </p:column>
                  </p:dataTable>
              </h:form>
           </f:view>
       </p:tab>
</p:accordionPanel>
   
    <h1>Créer/Editer un Etudiant</h1>
    <h:form id="formAjout">
       <p:panelGrid columns="3">
                 <p:outputLabel for="nom" value="Nom: "/>
                 <p:inputText id="nom" value="#{etudiantBean.etudiant.nom}" required="true" requiredMessage="Le nom est requis" a:placeholder="votre nom" />
                 <p:message for="nom" />

                 <p:outputLabel for="prenom" value="Prénom: "/>
                 <p:inputText id="prenom" value="#{etudiantBean.etudiant.prenom}" required="true" requiredMessage="Le prenom est requis" a:placeholder="votre prénom" />
                 <p:message for="prenom" />

                 <p:outputLabel for="datenaiss" value="Date de Naissance: "/>
                 <p:calendar id="datenaiss" value="#{etudiantBean.etudiant.datenaiss}" required="true" requiredMessage="La date est requise" pattern="yyyy-MM-dd" a:placeholder="AAAA-MM-JJ"/>
                 <p:message for="datenaiss" />

                 <h:commandButton value="Enregistrer" action="#{etudiantBean.AddEtudiant(etudiantBean.etudiant)}" />
                 <br/>
                 <br/>
       </p:panelGrid>
    </h:form>
    </h:body>

</html>
