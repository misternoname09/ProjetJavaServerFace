<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:a="http://xmlns.jcp.org/jsf/passthrough">


	<f:metadata>
	    <f:event listener="#{etudiantBean.chargerListeEtudiant}" type="preRenderView"></f:event>
	</f:metadata>

<h:head>
   <title>Liste des Etudiants</title>
</h:head>
<h:body>
   <p:accordionPanel>
       <p:tab title="Liste étudiants">
           <f:view>
              <h:form id="studentForm">
                <h:outputText value="Liste étudiants" style="font-weight:bold; font-size:1.2em; display:block; margin-bottom:10px;"/>
                  <p:dataTable value="#{etudiantBean.listeEtudiant}" var="e"
                   style="margin:auto; text-align:left">
                     <p:column>
                       <f:facet name="header">ID</f:facet>
                       #{e.id}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Nom</f:facet>
                       #{e.nom}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Prénom</f:facet>
                       #{e.prenom}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Date de Naissance</f:facet>
                       <h:outputText value="#{e.datenaiss}">
                           <f:convertDateTime pattern="dd/MM/yyyy" />
                       </h:outputText>
                     </p:column>
                      <p:column>
                      <f:facet name="header">Modifier</f:facet>
                       <h:commandLink value="modifier" action="#{etudiantBean.updateEtudiant(e.id)}" a:aria-label="Modifier l'étudiant #{e.nom} #{e.prenom}"/>
                     </p:column>

                       <p:column>
                       <f:facet name="header">Supprimer</f:facet>
                       <h:commandButton value="Supprimer"
                                      onclick="return confirm('Voulez-vous vraiment supprimer l\'étudiant #{e.nom} #{e.prenom} ?');"
                                      action="#{etudiantBean.deleteEtudiant(e.id)}"
                                      a:aria-label="Supprimer l'étudiant #{e.nom} #{e.prenom}"/>
                     </p:column>
                  </p:dataTable>

    <h2 style="margin-top:20px;">Créer/Editer un Etudiant</h2>
     <p:panelGrid columns="3">
                 <p:outputLabel for="nom" value="Nom: "/>
                 <p:inputText id="nom" value="#{etudiantBean.etudiant.nom}" a:placeholder="votre nom" required="true" requiredMessage="Le nom est obligatoire" />
                 <p:message for="nom" />

                 <p:outputLabel for="prenom" value="Prénom: "/>
                 <p:inputText id="prenom" value="#{etudiantBean.etudiant.prenom}" a:placeholder="votre prénom" required="true" requiredMessage="Le prénom est obligatoire" />
                 <p:message for="prenom" />

                 <p:outputLabel for="datenaiss" value="Date de Naissance: "/>
                 <p:calendar id="datenaiss" value="#{etudiantBean.etudiant.datenaiss}" a:placeholder="votre date de naissance" pattern="dd/MM/yyyy" showOn="button"/>
                 <p:message for="datenaiss" />

                 <h:commandButton value="Enregistrer" action="#{etudiantBean.AddEtudiant(etudiantBean.etudiant)}" />
                 <br/>
     </p:panelGrid>
              </h:form>
           </f:view>
       </p:tab>
</p:accordionPanel>
    </h:body>

</html>
