<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:a="http://xmlns.jcp.org/jsf/passthrough">
	 
	
	<f:metadata>
	    <f:event listener="#{etudiantBean.chargerListeEtudiant}" type="preRenderView"></f:event>
	</f:metadata>
		
<h:head>
   <title>Liste des Etudiants</title>
</h:head>
<h:body>
   <p:accordionPanel>
       <p:tab title="Liste étudiants">
           <f:view>
              <h:form id="formListe">
                <h:outputText value="Liste étudiants" style="font-weight:bold; display:block; margin-bottom:10px;"></h:outputText>
                  <p:dataTable value="#{etudiantBean.listeEtudiant}" var="e"
                   style="margin:auto; text-align:left">
                     <p:column headerText="ID">
                       #{e.id}
                     </p:column>
                     <p:column headerText="Nom">
                       #{e.nom}
                     </p:column>
                     <p:column headerText="Prénom">
                       #{e.prenom}
                     </p:column>
                     <p:column headerText="Date de Naissance">
                       <h:outputText value="#{e.datenaiss}"><f:convertDateTime pattern="dd/MM/yyyy"/></h:outputText>
                     </p:column>
                     <p:column headerText="Modifier">
                       <h:commandLink value="modifier" action="#{etudiantBean.updateEtudiant(e.id)}" a:aria-label="Modifier l'etudiant #{e.nom} #{e.prenom}"/>
                     </p:column>
                     <p:column headerText="Supprimer">
                       <h:commandButton value="Supprimer" 
                                      onclick="return confirm('Voulez-vous supprimer cet étudiant ?');"
                                      action="#{etudiantBean.deleteEtudiant(e.id)}"
                                      a:aria-label="Supprimer l'etudiant #{e.nom} #{e.prenom}"/>
                     </p:column>
                  </p:dataTable>
              </h:form>
           </f:view>
       </p:tab>
</p:accordionPanel>
   
    <h1>Créer/Editer un Etudiant</h1>
    <h:form id="formAjout">
        <h:panelGrid columns="3" style="margin-bottom:10px;">
            <p:outputLabel for="nom" value="Nom: "/>
            <p:inputText id="nom" value="#{etudiantBean.etudiant.nom}" a:placeholder="votre nom" required="true" requiredMessage="Le nom est requis." />
            <p:message for="nom" />

            <p:outputLabel for="prenom" value="Prénom: "/>
            <p:inputText id="prenom" value="#{etudiantBean.etudiant.prenom}" a:placeholder="votre prénom" required="true" requiredMessage="Le prénom est requis." />
            <p:message for="prenom" />

            <p:outputLabel for="datenaiss" value="Date de Naissance: "/>
            <p:calendar id="datenaiss" value="#{etudiantBean.etudiant.datenaiss}" a:placeholder="dd/MM/yyyy" pattern="dd/MM/yyyy" required="true" requiredMessage="La date de naissance est requise."/>
            <p:message for="datenaiss" />
        </h:panelGrid>
        <h:commandButton value="Enregistrer" action="#{etudiantBean.AddEtudiant(etudiantBean.etudiant)}" />
    </h:form>
    </h:body>

</html>
