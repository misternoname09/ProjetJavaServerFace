<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:a="http://xmlns.jcp.org/jsf/passthrough">


	<f:metadata>
	    <f:event listener="#{etudiantBean.chargerListeEtudiant}" type="preRenderView"></f:event>
	</f:metadata>

<h:head>
   <title>Liste des Etudiants</title>
</h:head>
<h:body>
   <p:accordionPanel>
       <p:tab title="Liste étudiants">
           <f:view>
              <h:form id="listeForm">
                  <p:dataTable value="#{etudiantBean.listeEtudiant}" var="e"
                   style="margin:auto; text-align:left">
                     <p:column headerText="ID">#{e.id}</p:column>
                     <p:column headerText="Nom">#{e.nom}</p:column>
                     <p:column headerText="Prénom">#{e.prenom}</p:column>
                     <p:column headerText="Date de Naissance">
                       <h:outputText value="#{e.datenaiss}"><f:convertDateTime pattern="dd/MM/yyyy" /></h:outputText>
                     </p:column>
                      <p:column headerText="Modifier">
                       <h:commandLink value="modifier" action="#{etudiantBean.updateEtudiant(e.id)}" a:aria-label="Modifier l'étudiant #{e.nom} #{e.prenom}"/>
                     </p:column>
                       <p:column headerText="Supprimer">
                       <h:commandButton value="Supprimer" onclick="if(!confirm('Voulez-vous supprimer cet étudiant ?')) return false;"
                                      action="#{etudiantBean.deleteEtudiant(e.id)}" a:aria-label="Supprimer l'étudiant #{e.nom} #{e.prenom}"/>
                     </p:column>
                  </p:dataTable>
              </h:form>
           </f:view>
       </p:tab>
</p:accordionPanel>

    <h1>Créer/Editer un Etudiant</h1>
    <h:form id="creationForm">
        <p:panelGrid columns="3" styleClass="ui-panelgrid-blank">
            <p:outputLabel for="nom" value="Nom: "/>
            <p:inputText id="nom" value="#{etudiantBean.etudiant.nom}" required="true" a:placeholder="votre nom" />
            <p:message for="nom" />
            <p:outputLabel for="prenom" value="Prénom: "/>
            <p:inputText id="prenom" value="#{etudiantBean.etudiant.prenom}" required="true" a:placeholder="votre prénom" />
            <p:message for="prenom" />
            <p:outputLabel for="dateNais" value="Date de Naissance: "/>
            <p:calendar id="dateNais" value="#{etudiantBean.etudiant.datenaiss}" required="true" pattern="dd/MM/yyyy" a:placeholder="jj/mm/aaaa"/>
            <p:message for="dateNais" />
        </p:panelGrid>
        <p:commandButton value="Enregistrer" action="#{etudiantBean.AddEtudiant(etudiantBean.etudiant)}" update="@form :listeForm" style="margin-top:10px" />
    </h:form>
    </h:body>

</html>
