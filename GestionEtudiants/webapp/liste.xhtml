<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:a="http://xmlns.jcp.org/jsf/passthrough">
	 
	
	<f:metadata>
	    <f:event listener="#{etudiantBean.chargerListeEtudiant}" type="preRenderView"></f:event>
	</f:metadata>
		
<h:head>
   <title>Liste des Etudiants</title>
</h:head>
<h:body>
   <p:accordionPanel>
       <p:tab title="Liste étudiants">
           <f:view>
              <h:form id="formListe">
                <h:outputText value="Liste étudiants"></h:outputText>
                  <p:dataTable value="#{etudiantBean.listeEtudiant}" var="et"
                   style="margin:auto; text-align:left">
                     <p:column headerText="ID">
                       #{et.id}
                     </p:column>
                      <p:column headerText="Nom">
                       #{et.nom}
                     </p:column>
                      <p:column headerText="Prénom">
                       #{et.prenom}
                     </p:column>
                      <p:column headerText="Date de Naissance">
                       #{et.datenaiss}
                     </p:column>
                      <p:column headerText="Modifier">
                       <h:commandLink value="modifier" action="#{etudiantBean.updateEtudiant(et.id)}"/>
                     </p:column>
                     
                       <p:column headerText="Supprimer">
                       <h:commandButton value="Supprimer" 
                                      onclick="if(! confirm('Voulez-vous supprimer cet étudiant ?')) return false;"
                                      action="#{etudiantBean.deleteEtudiant(et.id)}"/>
                     </p:column>
                  </p:dataTable>
              </h:form>
           </f:view>
       </p:tab>
</p:accordionPanel>
   
    <h1>Créer/Editer un Etudiant</h1>
    <h:form id="formAjout">
     <p:panelGrid columns="3">
                 <p:outputLabel for="nom" value="Nom: "/>
                 <p:inputText id="nom" value="#{etudiantBean.etudiant.nom}" a:placeholder="votre nom" />
                 <br/>
                 <p:outputLabel for="prenom" value="Prénom: "/>
                 <p:inputText id="prenom" value="#{etudiantBean.etudiant.prenom}" a:placeholder="votre prénom" />
                 <br/>
                 <p:outputLabel for="datenaiss" value="Date de Naissance: "/>
                 <p:calendar id="datenaiss" value="#{etudiantBean.etudiant.datenaiss}" pattern="dd/MM/yyyy" a:placeholder="votre date de naissance"/>
                 <br/>
                 <h:commandButton value="Enregistrer" action="#{etudiantBean.AddEtudiant(etudiantBean.etudiant)}" />
                 <br/>
     </p:panelGrid>
    </h:form>
    </h:body>

</html>
