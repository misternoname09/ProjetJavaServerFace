<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:a="http://xmlns.jcp.org/jsf/passthrough">
	 
	
	<f:metadata>
	    <f:event listener="#{etudiantBean.chargerListeEtudiant}" type="preRenderView"></f:event>
	</f:metadata>
		
<h:head>
   <title>Liste des Etudiants</title>
</h:head>
<h:body>
   <p:accordionPanel>
       <p:tab title="Liste étudiants">
           <f:view>
              <h:form>
                <h:outputText value="Liste étudiants"></h:outputText>
                  <h.form> 
                  <p:dataTable value="#{etudiantBean.listeEtudiant}" var="e"
                   style="margin:auto; text-align:left">
                     <p:column>
                       <f:facet name="header">ID</f:facet>
                       #{et.id}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Nom</f:facet>
                       #{et.nom}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Prénom</f:facet>
                       #{et.prenom}
                     </p:column>
                      <p:column>
                       <f:facet name="header">Date de Naissance</f:facet>
                       #{et.dateNais}
                     </p:column>
                      <p:column>
                      <f:facet name="header">Modifier</f:facet>
                       <h:commandLink value="modifier" action="#{etudiantBean.updateEtudiant(e.id)}"/>
                     </p:column>
                     
                       <p:column>
                       <f:facet name="header">Supprimer</f:facet>
                       <h:commandButton value="Supprimer" 
                                      onclick=" if(! confirm('voulez-vous supprimer l'etudiant')) return false;"
                                      action="#{etudiantBean.deleteEtudiant(e.id)}"/>
                     </p:column>
                  </p:dataTable>
                  </h.form>
              </h:form>
           </f:view>
       </p:tab>
</p:accordionPanel>
   
    <h1>Créer/Editer un Etudiant</h1>
    <h:form id="formAjout">
        <p:messages id="messages" showDetail="true" closable="true" />
        <p:panelGrid columns="3">
            <p:outputLabel for="nom" value="Nom: " />
            <p:inputText id="nom" value="#{etudiantBean.etudiant.nom}" required="true" requiredMessage="Le nom est obligatoire" a:placeholder="votre nom" />
            <p:message for="nom" />
            <p:outputLabel for="prenom" value="Prénom: " />
            <p:inputText id="prenom" value="#{etudiantBean.etudiant.prenom}" required="true" requiredMessage="Le prénom est obligatoire" a:placeholder="votre prénom" />
            <p:message for="prenom" />
            <p:outputLabel for="datenaiss" value="Date de Naissance: " />
            <p:calendar id="datenaiss" value="#{etudiantBean.etudiant.datenaiss}" pattern="dd/MM/yyyy" required="true" requiredMessage="La date de naissance est obligatoire" a:placeholder="votre date de naissance" />
            <p:message for="datenaiss" />
            <h:commandButton value="Enregistrer" action="#{etudiantBean.AddEtudiant(etudiantBean.etudiant)}" />
            <h:commandButton value="Annuler" action="liste" immediate="true" />
        </p:panelGrid>
    </h:form>
    </h:body>

</html>
